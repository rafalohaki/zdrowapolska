    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta property="og:title" content="ZdrowaPolska — najkrótsza kolejka do specjalisty" />
    <meta property="og:description" content="Porównujemy oficjalne czasy oczekiwania NFZ w 16 województwach. Apteki, SOR-y, nocna pomoc i doradca AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zdrowapolska.autarch.workers.dev" />
    <meta property="og:site_name" content="ZdrowaPolska" />
    <meta property="og:locale" content="pl_PL" />
    <link rel="canonical" href="https://zdrowapolska.autarch.workers.dev" />
    <!-- crawler'y social wymagają absolutnego URL; przy zmianie domeny zaktualizuj -->
    <meta property="og:image" content="https://zdrowapolska.autarch.workers.dev/og.png" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="900" />

    <meta name="theme-color" content="#059669" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta
      name="description"
      content="ZdrowaPolska — porównywarka czasów oczekiwania do lekarzy specjalistów na NFZ. Sprawdź, gdzie dostaniesz się na wizytę najszybciej."
    />
    <title>ZdrowaPolska — najkrótsza kolejka do specjalisty</title>
    <script>
      // motyw przed pierwszym renderem (bez mignięcia jasnym)
      try {
        const t = localStorage.getItem('zp_theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
